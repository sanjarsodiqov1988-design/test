<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>DSP Mobil Test (120 ta savol)</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --success: #10b981;
    --danger: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card); padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 1.1rem; font-weight: 700; color: #60a5fa; }
  .badge { background: #334155; padding: 4px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; }
  .container { max-width: 600px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
  .btn { width: 100%; padding: 14px 16px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .btn-primary { background: var(--primary); color: white; justify-content: center; text-align: center; }
  .btn-primary:active { transform: scale(0.98); background: #2563eb; }
  .btn-mode { background: #0f172a; color: var(--text); border: 1px solid var(--border); margin-bottom: 10px; }
  .btn-mode:active { background: #334155; }
  .q-header { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
  .q-text { font-size: 1.08rem; font-weight: 600; line-height: 1.45; margin-bottom: 16px; }
  .opt-btn { width: 100%; text-align: left; background: #0f172a; color: var(--text); border: 1.5px solid var(--border); padding: 13px 15px; border-radius: 12px; margin-bottom: 10px; font-size: 0.95rem; line-height: 1.35; cursor: pointer; transition: 0.15s; }
  .opt-btn.correct { background: rgba(16, 185, 129, 0.18); border-color: var(--success); color: #6ee7b7; font-weight: 600; }
  .opt-btn.wrong { background: rgba(239, 68, 68, 0.18); border-color: var(--danger); color: #fca5a5; }
  .nav-row { display: flex; gap: 10px; margin-top: 8px; }
  .search-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 0.95rem; margin-bottom: 12px; }
  .cheat-item { padding: 12px; border-bottom: 1px solid var(--border); }
  .cheat-q { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; color: #e2e8f0; }
  .cheat-a { color: #34d399; font-size: 0.9rem; font-weight: 500; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 onclick="showMenu()" style="cursor:pointer;">📱 DSP Mobil Test</h1>
  <span class="badge" id="top-stat">120 savol</span>
</header>

<div class="container">
  <div id="menu-view" class="card">
    <h2 style="margin-bottom:6px; font-size:1.2rem;">Rejimni tanlang</h2>
    <p style="color:var(--muted); font-size:0.88rem; margin-bottom:16px;">Internet talab qilinmaydi. Telefonda to'liq ishlaydi.</p>
    <button class="btn btn-mode" onclick="startQuiz(0, 30)"><span>1–30 savollar (1-bo'lim)</span><span>▶</span></button>
    <button class="btn btn-mode" onclick="startQuiz(30, 60)"><span>31–60 savollar (2-bo'lim)</span><span>▶</span></button>
    <button class="btn btn-mode" onclick="startQuiz(60, 90)"><span>61–90 savollar (3-bo'lim)</span><span>▶</span></button>
    <button class="btn btn-mode" onclick="startQuiz(90, 120)"><span>91–120 savollar (4-bo'lim)</span><span>▶</span></button>
    <button class="btn btn-mode" onclick="startQuiz(0, 120)"><span>Barcha 120 ta savol (Ketma-ket)</span><span>🔥</span></button>
    <button class="btn btn-mode" onclick="startRandomExam()"><span>Imtihon rejimi (Tasodifiy 30 ta)</span><span>🎲</span></button>
    <button class="btn btn-mode" id="mistakes-btn" onclick="startMistakes()"><span>Xatolar ustida ishlash (<span id="mistake-count">0</span>)</span><span>⚠️</span></button>
    <button class="btn btn-mode" onclick="showCheatSheet()"><span>🔍 Shpargalka va Qidiruv</span><span>📖</span></button>
  </div>

  <div id="quiz-view" class="card hidden">
    <div class="q-header">
      <span id="q-progress">Savol 1 / 30</span>
      <span id="q-score">To'g'ri: 0 | Xato: 0</span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div id="opts-box"></div>
    <div class="nav-row">
      <button class="btn btn-mode" style="margin:0; justify-content:center;" onclick="showMenu()">🏠 Menyu</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Keyingisi ➡</button>
    </div>
  </div>

  <div id="result-view" class="card hidden" style="text-align:center;">
    <h2 style="margin-bottom:10px;">Natija</h2>
    <p id="res-summary" style="font-size:1.3rem; font-weight:700; color:#60a5fa; margin-bottom:18px;"></p>
    <button class="btn btn-primary" style="margin-bottom:10px;" onclick="showMenu()">Bosh menyuga qaytish</button>
  </div>

  <div id="cheat-view" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3>Barcha savollar va javoblar</h3>
      <button class="badge" style="border:none; color:white; cursor:pointer;" onclick="showMenu()">✕ Yopish</button>
    </div>
    <input type="text" id="search-inp" class="search-input" placeholder="Savol yoki javobdan qidiring..." oninput="renderCheat()">
    <div id="cheat-list" style="max-height: 70vh; overflow-y: auto;"></div>
  </div>
</div>

<script>
const QUESTIONS = [{"id": 1, "q": "Signalning vaqt sohasidagi tasviri qaysi bog‘lanishni ifodalaydi?", "opts": ["Amplitudaning vaqtga bog‘liqligini", "Spektrning chastotaga taqsimlanishini", "Kvantlash darajalarining kodlar bilan bog‘lanishini", "Chastota komponentlarining o‘zaro nisbatini"], "a": 0}, {"id": 2, "q": "Signal chastota sohasida tahlil qilinganda qaysi ma’lumot asosiy hisoblanadi?", "opts": ["Signalning vaqt bo‘yicha davomiyligi", "Amplitudaning diskret qiymatlari", "Spektral komponentlarning taqsimlanishi", "Signalning kodlangan raqamli ketma-ketligi"], "a": 2}, {"id": 3, "q": "Analog signalni raqamli ko‘rinishga o‘tkazishda diskretlash qaysi jarayonni bajaradi?", "opts": ["Amplitudani belgilangan sathlarga ajratadi", "Vaqt bo‘yicha qiymatlar oladi", "Signal tarkibidagi shovqinni kamaytiradi", "Olingan qiymatlarni raqamli kodlarga almashtiradi"], "a": 1}, {"id": 4, "q": "Kvantlash natijasida signalda qanday o‘zgarish yuz beradi?", "opts": ["Signal alohida vaqt qismlariga bo‘linadi", "Spektral komponentlar tartiblanadi", "Diskret nuqtalar orasidagi qiymatlar tiklanadi", "Amplituda belgilangan sathlarga moslashtiriladi"], "a": 3}, {"id": 5, "q": "Diskretlash va kvantlash o‘rtasidagi asosiy farq qaysi?", "opts": ["Birinchisi vaqt, ikkinchisi amplituda bilan bog‘liq", "Birinchisi spektr, ikkinchisi vaqt bilan bog‘liq", "Birinchisi filtrlash, ikkinchisi kodlashni bajaradi", "Birinchisi amplitudani, ikkinchisi chastotani o‘zgartiradi"], "a": 0}, {"id": 6, "q": "Signalga vaqt doirasida ishlov berishda qaysi xususiyat bevosita kuzatiladi?", "opts": ["Spektral tashkil etuvchilarning chastota bo‘yicha joylashuvi", "Signal qiymatlarining vaqt davomida o‘zgarishi", "Protsessor xotirasidagi ma’lumotlarning adreslanishi", "Bazis funksiyalarining spektrga ta’siri"], "a": 1}, {"id": 7, "q": "Segmentlashdan foydalanishning asosiy sababi qaysi?", "opts": ["Signal amplitudasini oshirish", "Barcha chastotalarni bitta qiymatga keltirish", "Signalni tahlil qilinadigan qisml ullar misol sifatida keltirilgan?", "opts": ["Segmentlash va freymlash", "Svyortka va korrelyatsiya", "Diskretlash va kodlash", "Minimaks va o‘rtacha kvadrat xato"], "a": 3}, {"id": 15, "q": "Interpolyatsiya qaysi vaziyatda qo‘llanilishi maqsadga muvofiq?", "opts": ["Diskret nuqtalar orasidagi qiymatlar kerak bo‘lganda", "Signalni butunlay chastota sohasidan chiqarishda", "Protsessor xotirasini qayta adreslash talab qilinganda", "Signalning barcha amplitudalarini nolga tushirishda"], "a": 0}, {"id": 16, "q": "Signalni chastota muhitida tahlil qilishdan ko‘zlangan asosiy natija nima?", "opts": ["Vaqt bo‘yicha freymlar sonini ko‘paytirish", "Signalning spektral tarkibini ajratish", "Kvantlash darajalarini bitta qiymatga keltirish", "Signal protsessorining adreslash usulini o‘zgartirish"], "a": 1}, {"id": 17, "q": "Spektr tushunchasi signalning qaysi xususiyatini ifodalaydi?", "opts": ["Vaqt nuqtalarining kodlanish tartibini", "Signalning xotirada joylashish ketma-ketligini", "Turli chastotalar bo‘yicha tarkibini", "Kvantlashdan keyingi raqamli kodlar sonini"], "a": 2}, {"id": 18, "q": "Bazis funksiyalardan spektral tahlilda foydalanishdan maqsad nima?", "opts": ["Signalning spektral komponentlarini ifodalash", "Protsessorning asosiy xotirasini kengaytirish", "Signalni faqat vaqt bo‘yicha segmentlarga ajratish", "Analog signal amplitudasini doimiy saqlash"], "a": 0}, {"id": 19, "q": "Wavelet o‘zgartirish boshqa ko‘plab spektral yondashuvlardan qaysi jihati bilan ajralib turadi?", "opts": ["Faqat amplituda qiymatlarini kodlashi bilan", "Vaqt va chastotani birgalikda tahlil qilishi bilan", "Signalni faqat uzluksiz ko‘rinishda qayta ishlashi bilan", "Barcha spektral komponentlarni bitta chastotaga birlashtirishi bilan"], "a": 1}, {"id": 20, "q": "Signalda qisqa vaqt oralig‘ida yuz beradigan mahalliy o‘zgarishlarni tahlil qilishda qaysi yondashuv mosroq?", "opts": ["Faqat kvantlash darajalarini ko‘paytirish", "Oddiy kodlash jarayonini takrorlash", "Signalni faqat xotirada  2}, {"id": 28, "q": "Integral bazis tizimlarining spektral tahlildagi vazifasi qaysi?", "opts": ["Signalni raqamli kodga aylantirish", "Vaqt segmentlarini xotirada saqlash", "Protsessorning hisoblash tezligini oshirish", "Signalni bazis funksiyalar orqali ifodalash"], "a": 3}, {"id": 29, "q": "Bazisli spektral o‘zgartirishning mohiyati nimaga asoslanadi?", "opts": ["Signalni bazis funksiyalar yordamida tahlil qilishga", "Signalning barcha qiymatlarini bitta sathga keltirishga", "Faqat vaqt oralig‘ini qisqartirishga", "Xotira adreslarini qayta taqsimlashga"], "a": 0}, {"id": 30, "q": "Wavelet usuli qaysi turdagi tahlil uchun ayniqsa qulay?", "opts": ["Faqat doimiy amplitudali signalni tekshirish", "Mahalliy o‘zgarishlarni aniqlash", "Protsessor buyruqlarini ketma-ket bajarish", "Signalni faqat raqamli kodlarga almashtirish"], "a": 1}, {"id": 31, "q": "Wavelet o‘zgartirishda signal haqidagi qaysi ikki xususiyat birgalikda kuzatiladi?", "opts": ["Kod va adres", "Amplituda va xotira", "Vaqt va chastota", "Segment va protsessor"], "a": 2}, {"id": 32, "q": "Spektral ishlov berish tizimida shovqinni kamaytirish nimaga tayanishi mumkin?", "opts": ["Protsessor adreslarini almashtirishga", "Signalni faqat kodlashga", "Barcha komponentlarni kuchaytirishga", "Keraksiz spektral komponentlarni boshqarishga"], "a": 3}, {"id": 33, "q": "Spektral ishlov berish tizimlarining vazifalari qatorini aniqlang.", "opts": ["Filtrlash, siqish va shovqinni kamaytirish", "Adreslash, kod yozish va xotirani kengaytirish", "Diskretlash, protsessor almashtirish va freymlash", "Faqat analog signalni uzatish va saqlash"], "a": 0}, {"id": 34, "q": "Real vaqt tizimida signalni qayta ishlashning muhim jihati qaysi?", "opts": ["Faqat katta hajmdagi xotiradan foydalanish", "Natijani talab etilgan vaqtda olish", "Signalni barcha holatlarda siqib saqlash", "Faqat analog qurilmalar bilan ishlash"], "a": 1}, {"id": 35, "q": "Signal protsessorlarida parallel hisoblash imkoniyati nima uchun muhim?", "opts": [" let currentList = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let mistakes = JSON.parse(localStorage.getItem('dsp_mistakes') || '[]');

function updateMistakeBadge() {
  document.getElementById('mistake-count').innerText = mistakes.length;
}
updateMistakeBadge();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showMenu() {
  document.getElementById('menu-view').classList.remove('hidden');
  document.getElementById('quiz-view').classList.add('hidden');
  document.getElementById('result-view').classList.add('hidden');
  document.getElementById('cheat-view').classList.add('hidden');
  updateMistakeBadge();
}

function startQuiz(start, end) {
  currentList = QUESTIONS.slice(start, end);
  beginSession();
}

function startRandomExam() {
  currentList = shuffle(QUESTIONS).slice(0, 30);
  beginSession();
}

function startMistakes() {
  if (mistakes.length === 0) {
    alert("Hozircha xato qilingan savollar yo'q!");
    return;
  }
  currentList = QUESTIONS.filter(q => mistakes.includes(q.id));
  beginSession();
}

function beginSession() {
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById('menu-view').classList.add('hidden');
  document.getElementById('result-view').classList.add('hidden');
  document.getElementById('quiz-view').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = currentList[currentIndex];
  document.getElementById('q-progress').innerText = `Savol ${currentIndex + 1} / ${currentList.length} (#${item.id})`;
  document.getElementById('q-score').innerText = `✅ ${correctCount} | ❌ ${wrongCount}`;
  document.getElementById('q-text').innerText = `${item.id}. ${item.q}`;

  const optsWithIndex = item.opts.map((t, idx) => ({ text: t, isCorrect: idx === item.a }));
  const mixed = shuffle(optsWithIndex);

  const box = document.getElementById('opts-box');
  box.innerHTML = '';
  mixed.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.innerText = opt.text;
    b.onclick = () => selectAnswer(b, opt.isCorrect, mixed, item.id);
    box.appendChild(b);
  });
}

function selectAnswer(btn, isCorrect, mixed, qId) {
  if (answered) return;
  answered = true;
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach((b, idx) => {
    if (mixed[idx].isCorrect) b.classList.add('correct');
  });
  if (isCorrect) {
    correctCount++;
    mistakes = mistakes.filter(id => id !== qId);
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    if (!mistakes.includes(qId)) mistakes.push(qId);
  }
  localStorage.setItem('dsp_mistakes', JSON.stringify(mistakes));
  document.getElementById('q-score').innerText = `✅ ${correctCount} | ❌ ${wrongCount}`;
}

function nextQuestion() {
  if (currentIndex + 1 < currentList.length) {
    currentIndex++;
    renderQuestion();
  } else {
    document.getElementById('quiz-view').classList.add('hidden');
    document.getElementById('result-view').classList.remove('hidden');
    const pct = Math.round((correctCount / currentList.length) * 100);
    document.getElementById('res-summary').innerText = `${currentList.length} tadan ${correctCount} ta to'g'ri (${pct}%)`;
  }
}

function showCheatSheet() {
  document.getElementById('menu-view').classList.add('hidden');
  document.getElementById('cheat-view').classList.remove('hidden');
  renderCheat();
}

function renderCheat() {
  const q = document.getElementById('search-inp').value.toLowerCase();
  const list = document.getElementById('cheat-list');
  list.innerHTML = '';
  QUESTIONS.filter(item => item.q.toLowerCase().includes(q) || item.opts[item.a].toLowerCase().includes(q)).forEach(item => {
    const d = document.createElement('div');
    d.className = 'cheat-item';
    d.innerHTML = `<div class="cheat-q">${item.id}. ${item.q}</div><div class="cheat-a">✓ ${item.opts[item.a]}</div>`;
    list.appendChild(d);
  });
}
</script>
